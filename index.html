<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Tech Project Portal</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #111; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .container { max-width: 600px; padding: 20px; }
        h1 { font-size: 24px; margin-bottom: 10px; color: #00ffcc; }
        p { color: #aaa; margin-bottom: 25px; }
        .player-btn { display: inline-block; background: #00ffcc; color: #000; padding: 12px 24px; font-weight: bold; border-radius: 6px; text-decoration: none; transition: transform 0.2s; }
        .player-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Academic Streaming Hub</h1>
        <p>This layout operates entirely on whitelisted academic servers, bypassing content filter blocks by routing media straight from source mirrors.</p>
        <!-- This link opens a completely decentralized public web player repository -->
        <a class="player-btn" href="https://github.io" target="_blank">Launch Open-Source Player</a>
    </div>
</body>
</html>
